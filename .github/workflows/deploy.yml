name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# Identificadores de recursos creados por Terraform (no son secretos).
env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::891762599488:role/haz-ops-github-actions-deploy
  S3_BUCKET: haz-ops-frontend-a29b1390
  CF_DISTRIBUTION_ID: E5VVO550912H8

jobs:
  deploy:
    name: Deploy to S3 & CloudFront (OIDC)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA bundle
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Show deploy target
        run: |
          echo "::notice::Bucket=${S3_BUCKET} Distribution=${CF_DISTRIBUTION_ID} VarBucket='${{ vars.AWS_S3_BUCKET }}'"
          aws sts get-caller-identity

      - name: Sync static assets to S3 (Cache-Control immutable)
        run: |
          set -o pipefail
          if ! aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
               --delete \
               --cache-control "public, max-age=31536000, immutable" 2> err.txt; then
            echo "::error::$(tr '\n' ' ' < err.txt)"
            exit 1
          fi

      - name: Sync root files to S3 (Cache-Control no-cache)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"
